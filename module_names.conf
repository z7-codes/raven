# ============================================================
#  module_names.conf — Raven's white-label mapping
#  Format: tool_binary|Display Name|output-file-slug|required|phase
#  - tool_binary  : the real binary raven.sh checks with `have`
#  - Display Name : shown on screen, in reports, in file names
#  - file-slug    : base name used for that module's output file
#  - required     : "required" or "optional" (shown on dep screen)
#  - phase        : grouping label for the dependency-check screen
#
#  To add/rename a module: edit this file only. No raven.sh changes
#  needed as long as the tool_binary key matches what's used in the
#  TOOLS[] map and the have()/add_job() calls in raven.sh.
# ============================================================
whois|Domain Registration Lookup|domain-registration|required|Passive Recon
dig|DNS Record Query|dns-records|required|Passive Recon
host|Host Record Check|host-records|required|Passive Recon
nslookup|Nameserver Query|nameserver-query|required|Passive Recon
dnsrecon|DNS Reconnaissance Sweep|dns-recon-sweep|required|Passive Recon
subfinder|Subdomain Enumeration|subdomains|required|Passive Recon
amass|Subdomain Cross-Reference|subdomains-crossref|optional|Passive Recon
recon-ng|OSINT Framework|osint-framework-notes|optional|Passive Recon
spiderfoot|OSINT Aggregator|osint-aggregator-notes|optional|Passive Recon
httpx|Live Host Probe|live-hosts|required|Active Recon
whatweb|Web Fingerprint|web-fingerprint|required|Active Recon
nmap|Port & Service Scan|port-service-scan|required|Deep Scan
masscan|Fast Port Sweep|fast-port-sweep|optional|Deep Scan
python3|Host Discovery Engine|host-discovery|optional|Deep Scan
nikto|Web Server Audit|web-server-audit|required|Vulnerability Scan
nuclei|Vulnerability Templates|vulnerability-templates|required|Vulnerability Scan
gvm-cli|Deep Vulnerability Engine|deep-vuln-engine-notes|optional|Vulnerability Scan
tshark|Packet Capture|packet-capture|required|Packet Capture
tmux|Parallel Session Manager|n/a|optional|System
